<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>广东六日最终行程｜花都 · 古龙峡 · 英西峰林 · 长隆</title>
<meta name="description" content="2026年国庆广东六日最终行程，含指定酒店、逐段交通、预计车程、古龙峡、英西峰林和长隆动物世界安排。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root {
  --bg-primary:#fff;
  --bg-secondary:#f5f5f7;
  --bg-grouped:#f2f2f7;
  --bg-elevated:#fff;
  --text-primary:#1d1d1f;
  --text-secondary:#6e6e73;
  --text-tertiary:#aeaeb2;
  --accent:#176b4d;
  --tint-red:#ff3b30;
  --tint-orange:#ff9500;
  --tint-green:#34c759;
  --tint-blue:#007aff;
  --tint-purple:#af52de;
  --separator:rgba(60,60,67,.12);
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 14px rgba(0,0,0,.08);
  --shadow-lg:0 8px 30px rgba(0,0,0,.12);
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:16px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC",Arial,sans-serif;
  background:var(--bg-secondary);color:var(--text-primary);-webkit-font-smoothing:antialiased;
  line-height:1.48;letter-spacing:-.018em
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.tabs{
  display:flex;gap:6px;padding:12px 16px;overflow-x:auto;background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(20px);position:sticky;top:0;z-index:99;
  border-bottom:.5px solid var(--separator);scrollbar-width:none
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex-shrink:0;padding:7px 15px;border-radius:999px;border:none;background:var(--bg-grouped);
  color:var(--text-secondary);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap
}
.tab:active{transform:scale(.96)}
.tab.active{background:var(--accent);color:#fff}
.content{max-width:720px;margin:0 auto;padding:16px 16px calc(28px + var(--safe-bottom))}
.hero{text-align:center;padding:28px 12px 20px}
.hero .eyebrow{font-size:12px;font-weight:750;color:var(--accent);letter-spacing:.08em;margin-bottom:8px}
.hero h1{font-size:29px;font-weight:750;letter-spacing:-.03em;line-height:1.12}
.hero .subtitle{font-size:16px;color:var(--text-secondary);margin-top:9px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.info-card,.pay-summary,.route-strip{
  background:var(--bg-elevated);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-sm)
}
.info-card .label{font-size:11px;font-weight:700;color:var(--text-secondary);letter-spacing:.05em;margin-bottom:6px}
.info-card .value{font-size:14px;font-weight:650;line-height:1.45}
.section-head{font-size:13px;font-weight:700;color:var(--text-secondary);letter-spacing:.035em;padding:21px 0 8px}
.day-head{padding:20px 0 12px}
.day-head h2{font-size:23px;font-weight:750;letter-spacing:-.025em}
.day-head p{font-size:14px;color:var(--text-secondary);margin-top:3px}
.route-bar{background:#eaf4ef;border-radius:var(--radius-md);padding:12px 14px;margin-bottom:14px;font-size:13px;color:#345c4d;line-height:1.7;white-space:pre-line}
.route-bar strong{color:#164b38}
.route-strip{padding:14px;margin-bottom:10px}
.route-flow{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:3px 0 7px;scrollbar-width:none}
.route-flow::-webkit-scrollbar{display:none}
.route-node{flex:0 0 auto;background:#eaf4ef;color:#164b38;border:1px solid #cbe1d7;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700}
.route-arrow{color:var(--text-tertiary);font-size:13px;flex:0 0 auto}
.route-note{font-size:12px;color:var(--text-secondary);line-height:1.55;margin-top:6px}
.transport-list{display:grid;gap:10px;margin-bottom:16px}
.transport-card{background:#edf6f2;border:1px solid #cfe3da;border-radius:var(--radius-md);padding:14px}
.transport-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.transport-mode{font-size:15px;font-weight:750;color:#164b38}
.transport-duration{font-size:12px;font-weight:750;color:var(--accent);background:#fff;padding:4px 8px;border-radius:999px;white-space:nowrap}
.transport-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.transport-place small{display:block;color:var(--text-secondary);font-size:11px;margin-bottom:2px}
.transport-place strong{font-size:14px;line-height:1.35}
.transport-arrow{color:var(--text-tertiary);font-size:16px}
.transport-note{font-size:12px;color:var(--text-secondary);line-height:1.55;margin-top:9px}
.timeline{position:relative;padding-left:24px}
.timeline::before{content:"";position:absolute;left:7px;top:20px;bottom:20px;width:1.5px;background:var(--separator)}
.tl-item{position:relative;margin-bottom:10px}
.tl-dot{position:absolute;left:-20px;top:18px;width:10px;height:10px;border-radius:50%;z-index:1;box-shadow:0 0 0 3px var(--bg-secondary)}
.tl-dot.food{background:var(--tint-red)}
.tl-dot.spot{background:var(--tint-blue)}
.tl-dot.hotel{background:var(--tint-orange)}
.tl-dot.drink{background:var(--tint-purple)}
.tl-dot.transport{background:var(--text-tertiary)}
.card{background:var(--bg-elevated);border-radius:var(--radius-md);padding:14px 16px;box-shadow:var(--shadow-sm);cursor:pointer}
.card:active{box-shadow:var(--shadow-md)}
.card .time{font-size:12px;font-weight:700;color:var(--text-tertiary)}
.card .name{font-size:17px;font-weight:650;margin:2px 0 4px;display:flex;align-items:center;gap:6px}
.card .desc{font-size:14px;color:var(--text-secondary);line-height:1.48}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:750;padding:1px 7px;border-radius:4px}
.badge.food{background:rgba(255,59,48,.1);color:var(--tint-red)}
.badge.spot{background:rgba(0,122,255,.1);color:var(--tint-blue)}
.badge.drink{background:rgba(175,82,222,.1);color:var(--tint-purple)}
.budget{display:inline-block;margin-top:6px;padding:3px 10px;background:var(--bg-grouped);border-radius:var(--radius-sm);font-size:12px;color:var(--text-secondary);font-weight:600}
.pays{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.pay{font-size:11px;padding:2px 7px;border-radius:4px;font-weight:650}
.pay.ok{background:rgba(52,199,89,.1);color:#248a3d}
.pay.idk{background:rgba(255,149,0,.1);color:#b25000}
.pay.no{background:rgba(255,59,48,.08);color:var(--tint-red)}
.links{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:4px;padding:8px 13px;border-radius:var(--radius-sm);font-size:13px;font-weight:650;border:none;cursor:pointer;text-decoration:none!important}
.btn:active{filter:brightness(.9)}
.btn.nav{background:var(--accent);color:#fff}
.btn.xhs{background:#ff2442;color:#fff}
.btn.dp{background:#ffa700;color:#fff}
.btn.rsv{background:var(--tint-green);color:#fff}
.details{margin-top:10px;padding-top:10px;border-top:.5px solid var(--separator);font-size:13px;color:var(--text-secondary);line-height:1.65}
.details.closed{display:none}
.day-list .card{margin-bottom:8px}
.day-list .dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.pay-summary{font-size:13px;line-height:1.68;margin-bottom:10px}
.pay-summary h4{font-size:15px;margin-bottom:4px}
.warn{color:#b42318}
.ok-text{color:#248a3d}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 0;font-size:12px;color:var(--text-secondary)}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-dot{width:8px;height:8px;border-radius:50%}
.as-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.35);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.as-overlay.show{opacity:1;pointer-events:auto}
.as-sheet{width:100%;max-width:420px;padding:0 8px 34px;transform:translateY(100%);transition:transform .3s cubic-bezier(.22,1,.36,1)}
.as-overlay.show .as-sheet{transform:translateY(0)}
.as-group{background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-radius:14px;overflow:hidden;margin-bottom:8px}
.as-group .as-item{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;font-size:18px;color:#007aff;font-weight:550;border:none;background:none;width:100%;cursor:pointer}
.as-group .as-item+.as-item{border-top:.5px solid rgba(0,0,0,.12)}
.as-cancel{font-weight:700!important}
@media(max-width:520px){
  .content{padding-left:12px;padding-right:12px}
  .hero h1{font-size:25px}
  .info-card{padding:14px}
  .transport-grid{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
}
</style>
</head>

function showDay(){}
function payChips(pay){
  if(!pay)return"";
  let h='<div class="pays">';
  const labels={cash:"现金",card:"银行卡",alipay:"支付宝",wechat:"微信"};
  for(const[k,label]of Object.entries(labels)){
    if(pay[k]!==undefined){const c=pay[k]===1?"ok":pay[k]===.5?"idk":"no";h+=`<span class="pay ${c}">${label}</span>`}
  }
  return h+"</div>";
}
const IN_APP_WEBVIEW=(()=>/micromessenger|xhs|xhsdiscover|discover\/|tiktok|aweme|weibo|qq\/|qqbrowser|alipayclient|dingtalk|lark|feishu|ucbrowser|baiduboxapp|toutiao|newsarticle/.test((navigator.userAgent||"").toLowerCase()))();
function xhsKeyword(loc){return(loc.xhsKeyword||loc.name||"").trim()}
function xhsAppUrl(loc){return`xhsdiscover://search/result?keyword=${encodeURIComponent(xhsKeyword(loc))}&target_search=notes&source=deeplink`}
function xhsWebUrl(loc){return`https://www.xiaohongshu.com/search_result?keyword=${encodeURIComponent(xhsKeyword(loc))}&source=web_explore_feed`}
function dpKeyword(loc){return(loc.dianpingKeyword||loc.name||"").trim()}
function dpAppUrl(loc){return`dianping://searchshoplist?keyword=${encodeURIComponent(dpKeyword(loc))}`}
function dpWebUrl(loc){return`https://m.dianping.com/searchshop?keyword=${encodeURIComponent(dpKeyword(loc))}`}
window._extLocs={};
DAYS.forEach(d=>d.locations.forEach(l=>{window._extLocs[`${d.id}::${l.name}`]=l}));
function openExt(key,kind){
  const loc=window._extLocs[key];if(!loc)return false;
  window.location.href=kind==="dp"?(IN_APP_WEBVIEW?dpWebUrl(loc):dpAppUrl(loc)):(IN_APP_WEBVIEW?xhsWebUrl(loc):xhsAppUrl(loc));
  return false;
}
function openXhs(key){return openExt(key,"xhs")}
function openDp(key){return openExt(key,"dp")}
function locCard(loc,dayIdx){
  const dot=["food","spot","drink","hotel"].includes(loc.type)?loc.type:"transport";
  const bdg=loc.type==="food"?'<span class="badge food">餐</span>':loc.type==="spot"?'<span class="badge spot">景</span>':loc.type==="drink"?'<span class="badge drink">饮</span>':"";
  const uid=`d${dayIdx}-${loc.name.replace(/\W/g,"")}`;
  const key=`${dayIdx}::${loc.name}`;
  const q=loc.gmap||encodeURIComponent(loc.name+" Guangdong China");
  let links=`<button class="btn nav" onclick="openAS('${loc.name.replace(/'/g,"\\'")}',${loc.lat},${loc.lng},'${q}')">📍 导航</button>`;
  if(loc.xhsKeyword){const href=IN_APP_WEBVIEW?xhsWebUrl(loc):xhsAppUrl(loc);links+=`<a href="${href}" onclick="return openXhs('${key.replace(/'/g,"\\'")}')" class="btn xhs">📕 小红书</a>`}
  if(loc.dianpingKeyword){const href=IN_APP_WEBVIEW?dpWebUrl(loc):dpAppUrl(loc);links+=`<a href="${href}" onclick="return openDp('${key.replace(/'/g,"\\'")}')" class="btn dp">🍜 大众点评</a>`}
  if(loc.reserve)links+=`<a href="${loc.reserve}" target="_blank" rel="noreferrer" class="btn rsv">📅 官方/预订</a>`;
  return`<div class="tl-item"><div class="tl-dot ${dot}"></div><div class="card" onclick="if(!event.target.closest('.btn,.links'))toggle('${uid}')"><div class="time">${loc.time!=="—"?loc.time:"备选"}</div><div class="name">${bdg}${loc.name}</div><div class="desc">${loc.desc}</div>${loc.budget?`<div class="budget">${loc.budget}</div>`:""}${payChips(loc.pay)}<div class="links">${links}</div>${loc.detail?`<div class="details" id="${uid}">${loc.detail.replace(/\n/g,"<br>")}</div>`:""}</div></div>`;
}
function renderTransfers(transfers=[]){
  if(!transfers.length)return"";
  return`<div class="section-head">当天交通</div><div class="transport-list">${transfers.map(t=>`
    <div class="transport-card">
      <div class="transport-head"><div class="transport-mode">🚐 ${t.mode}</div><div class="transport-duration">${t.duration}</div></div>
      <div class="transport-grid">
        <div class="transport-place"><small>出发地点</small><strong>${t.from}</strong></div>
        <div class="transport-arrow">→</div>
        <div class="transport-place"><small>到达地点</small><strong>${t.to}</strong></div>
      </div>
      ${t.note?`<div class="transport-note">${t.note}</div>`:""}
    </div>`).join("")}</div>`;
}
function renderDay(idx){
  const d=DAYS.find(x=>x.id===idx);if(!d)return"";
  const main=d.locations.filter(l=>l.time!=="—"),alt=d.locations.filter(l=>l.time==="—");
  let h=`<div class="day-head"><h2>${d.title}</h2><p>${d.date}</p></div><div class="route-bar"><strong>当天动线</strong>\n${d.route}</div>`;
  h+=renderTransfers(d.transfers);
  if(main.length){h+='<div class="section-head">行程与三餐</div><div class="timeline">';main.forEach(l=>h+=locCard(l,idx));h+="</div>"}
  if(alt.length){h+='<div class="section-head">顺路备选</div><div class="timeline">';alt.forEach(l=>h+=locCard(l,idx));h+="</div>"}
  return h;
}

let cur=0;
const tabsEl=document.getElementById("tabs"),contentEl=document.getElementById("content");
DAYS.forEach(d=>{
  const btn=document.createElement("button");
  btn.className="tab"+(d.id===0?" active":"");btn.dataset.day=d.id;btn.textContent=d.label;
  tabsEl.appendChild(btn);
});
function go(idx){
  cur=idx;
  tabsEl.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",+t.dataset.day===idx));
  contentEl.innerHTML=idx===0?overviewContent():renderDay(idx);
  window.scrollTo({top:0,behavior:"smooth"});
  const tab=tabsEl.querySelector(`[data-day="${idx}"]`);if(tab)tab.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
}
function toggle(id){const el=document.getElementById(id);if(el)el.classList.toggle("closed")}
tabsEl.addEventListener("click",e=>{const t=e.target.closest(".tab");if(t)go(+t.dataset.day)});

const asOverlay=document.createElement("div");
asOverlay.className="as-overlay";
asOverlay.innerHTML='<div class="as-sheet"><div class="as-group" id="as-opts"></div><div class="as-group"><button class="as-item as-cancel" onclick="closeAS()">取消</button></div></div>';
document.body.appendChild(asOverlay);
asOverlay.addEventListener("click",e=>{if(e.target===asOverlay)closeAS()});
const IS_IOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
function amapAppUrl(name,lat,lng){return`${IS_IOS?"iosamap":"androidamap"}://viewMap?sourceApplication=trip&poiname=${encodeURIComponent(name)}&lat=${lat}&lon=${lng}&dev=0`}
function amapWebUrl(name,lat,lng){return`https://uri.amap.com/marker?position=${lng},${lat}&name=${encodeURIComponent(name)}&src=trip&coordinate=wgs84&callnative=1`}
function openAmap(name,lat,lng){if(IN_APP_WEBVIEW){window.open(amapWebUrl(name,lat,lng));return}window.location.href=amapAppUrl(name,lat,lng)}
function openAS(name,lat,lng,gmap){
  const q=gmap||encodeURIComponent(name+" Guangdong China");
  const safeName=name.replace(/'/g,"\\'"),encName=encodeURIComponent(name);
  const appleUrl=IN_APP_WEBVIEW?`https://maps.apple.com/?q=${lat},${lng}&ll=${lat},${lng}&name=${encName}`:`maps://maps.apple.com/?q=${lat},${lng}&name=${encName}`;
  const googleUrl=`https://www.google.com/maps/search/?api=1&query=${q}`;
  document.getElementById("as-opts").innerHTML=`<button class="as-item" onclick="window.open('${appleUrl}');closeAS()">🍎 Apple Maps</button><button class="as-item" onclick="window.open('${googleUrl}');closeAS()">🗺️ Google Maps</button><button class="as-item" onclick="openAmap('${safeName}',${lat},${lng});closeAS()">🧭 高德地图 App</button>`;
  asOverlay.classList.add("show");
}
function closeAS(){asOverlay.classList.remove("show")}
contentEl.innerHTML=overviewContent();
</script>
